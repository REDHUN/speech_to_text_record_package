
group 'com.speechtotextrecord'
version '0.1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.speechtotextrecord'

    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

repositories {
    google()
    mavenCentral()
}
